<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 780" width="820" height="780" role="img" aria-labelledby="title desc">
  <title id="title">从 Markdown 到 GitHub Pages 的构建流程</title>
  <desc id="desc">Markdown 文章经 Astro 构建生成静态文件，由 GitHub Actions 自动发布到 GitHub Pages。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0a10"/>
      <stop offset="100%" stop-color="#151021"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; }
      .label { fill: #7f7a8d; font-size: 12px; letter-spacing: 2px; }
      .title { fill: #eeebe4; font-size: 24px; font-weight: 700; letter-spacing: 1.5px; }
      .body { fill: #a49eb2; font-size: 15px; }
      .num { fill: #c8ff3d; font-size: 38px; font-weight: 700; }
      .side { fill: #7f7a8d; font-size: 11px; letter-spacing: 1.4px; }
    </style>
  </defs>

  <rect width="820" height="780" fill="url(#bg)"/>
  <rect width="820" height="780" fill="url(#grid)"/>
  <circle cx="740" cy="40" r="230" fill="#8b5cf6" opacity="0.12"/>

  <text x="50" y="46" class="mono label" fill="#c8ff3d">PIPELINE // ONE COMMIT TO LIVE</text>
  <text x="50" y="78" class="mono" fill="#eeebe4" font-size="20" letter-spacing="1">从 Markdown 到线上页面</text>
  <line x1="50" y1="96" x2="770" y2="96" stroke="#2a2734" stroke-width="1"/>

  <!-- 01 -->
  <g>
    <rect x="50" y="112" width="720" height="108" fill="#0e0d14" stroke="#2f2b3b"/>
    <path d="M50 112h20M50 112v20" stroke="#8b5cf6" stroke-width="2" fill="none"/>
    <text x="76" y="178" class="mono num">01</text>
    <text x="152" y="148" class="mono title">MARKDOWN</text>
    <text x="152" y="176" class="mono body">src/content/blog/*.md · 封面与插图</text>
    <text x="152" y="200" class="mono body">frontmatter + 正文，全部版本管理</text>
    <text x="748" y="148" text-anchor="end" class="mono side">SOURCE</text>
    <text x="748" y="178" text-anchor="end" class="mono side" fill="#c8ff3d">GIT PUSH</text>
  </g>

  <path d="M410 220v34" stroke="#c8ff3d" stroke-width="2"/>
  <path d="m404 248 6 8 6-8" fill="none" stroke="#c8ff3d" stroke-width="2"/>

  <!-- 02 -->
  <g>
    <rect x="50" y="262" width="720" height="108" fill="#0e0d14" stroke="#2f2b3b"/>
    <path d="M50 262h20M50 262v20" stroke="#8b5cf6" stroke-width="2" fill="none"/>
    <text x="76" y="328" class="mono num">02</text>
    <text x="152" y="298" class="mono title">ASTRO BUILD</text>
    <text x="152" y="326" class="mono body">Markdown 渲染为 HTML · RSS / sitemap / 搜索索引</text>
    <text x="152" y="350" class="mono body">图片自动生成多尺寸 WebP</text>
    <text x="748" y="298" text-anchor="end" class="mono side">BUILD</text>
    <text x="748" y="328" text-anchor="end" class="mono side" fill="#c8ff3d">npm run build</text>
  </g>

  <path d="M410 370v34" stroke="#c8ff3d" stroke-width="2"/>
  <path d="m404 398 6 8 6-8" fill="none" stroke="#c8ff3d" stroke-width="2"/>

  <!-- 03 -->
  <g>
    <rect x="50" y="412" width="720" height="108" fill="#0e0d14" stroke="#2f2b3b"/>
    <path d="M50 412h20M50 412v20" stroke="#8b5cf6" stroke-width="2" fill="none"/>
    <text x="76" y="478" class="mono num">03</text>
    <text x="152" y="448" class="mono title">GITHUB ACTIONS</text>
    <text x="152" y="476" class="mono body">Ubuntu + Node 20 · npm ci · 上传 dist/ 作为 artifact</text>
    <text x="152" y="500" class="mono body">每次 push 自动触发，无需手动部署</text>
    <text x="748" y="448" text-anchor="end" class="mono side">AUTOMATE</text>
    <text x="748" y="478" text-anchor="end" class="mono side" fill="#c8ff3d">workflow</text>
  </g>

  <path d="M410 520v34" stroke="#c8ff3d" stroke-width="2"/>
  <path d="m404 548 6 8 6-8" fill="none" stroke="#c8ff3d" stroke-width="2"/>

  <!-- 04 -->
  <g>
    <rect x="50" y="562" width="720" height="108" fill="#0e0d14" stroke="#c8ff3d" stroke-opacity="0.5"/>
    <path d="M50 562h20M50 562v20" stroke="#c8ff3d" stroke-width="2" fill="none"/>
    <text x="76" y="628" class="mono num">04</text>
    <text x="152" y="598" class="mono title">GITHUB PAGES</text>
    <text x="152" y="626" class="mono body">全球 CDN · 免费 HTTPS · 静态 HTML / CSS / JS</text>
    <text x="152" y="650" class="mono body">没有服务器，没有数据库，也没有后台</text>
    <text x="748" y="598" text-anchor="end" class="mono side">SERVE</text>
    <text x="748" y="628" text-anchor="end" class="mono side" fill="#c8ff3d">● LIVE</text>
  </g>

  <line x1="50" y1="710" x2="770" y2="710" stroke="#2a2734" stroke-width="1"/>
  <circle cx="54" cy="742" r="4" fill="#c8ff3d"/>
  <text x="70" y="746" class="mono body" font-size="13">一次提交，约 60 秒后上线。</text>
  <text x="770" y="746" text-anchor="end" class="mono label">STATIC / FAST / PORTABLE</text>
</svg>